name: TouchDeck
options:
  bundleIdPrefix: com.harold
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  DeckKit:
    path: Packages/DeckKit
targets:
  TouchDeck:
    type: application
    platform: iOS
    sources: [TouchDeck]
    dependencies:
      - package: DeckKit
    info:
      path: TouchDeck/Info.plist
      properties:
        CFBundleDisplayName: TouchDeck
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: 같은 와이파이에 있는 맥의 TouchDeck을 찾아 버튼 누름을 보내기 위해 로컬 네트워크를 사용합니다.
        NSBonjourServices: [_touchdeck._tcp]
        NSFaceIDUsageDescription: 맥 잠금을 풀 때 본인인지 확인해요
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harold.TouchDeck
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: LA95MXQ3R5
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TouchDeckMac:
    type: application
    platform: macOS
    sources: [TouchDeckMac]
    dependencies:
      - package: DeckKit
    info:
      path: TouchDeckMac/Info.plist
      properties:
        CFBundleDisplayName: TouchDeck
        LSUIElement: true
        NSAppleEventsUsageDescription: 버튼을 누르면 고른 터미널에 새 창을 열고 명령을 실행하기 위해 사용합니다.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harold.TouchDeckMac
        PRODUCT_NAME: TouchDeck
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        # 손쉬운 사용 권한이 빌드마다 풀리지 않게 팀 서명으로 고정 (xcodegen 다시 돌려도 유지)
        DEVELOPMENT_TEAM: LA95MXQ3R5
        CODE_SIGN_STYLE: Automatic
  TouchDeckMacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [TouchDeckMacTests]
    dependencies:
      - target: TouchDeckMac
    settings:
      base:
        DEVELOPMENT_TEAM: LA95MXQ3R5
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TouchDeck.app/Contents/MacOS/TouchDeck"
        BUNDLE_LOADER: "$(TEST_HOST)"
  TouchDeckUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TouchDeckUITests]
    dependencies:
      - target: TouchDeck
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TouchDeck
schemes:
  TouchDeckMac:
    build:
      targets:
        TouchDeckMac: all
        TouchDeckMacTests: [test]
    test:
      targets: [TouchDeckMacTests]
  TouchDeck:
    build:
      targets:
        TouchDeck: all
        TouchDeckUITests: [test]
    test:
      targets: [TouchDeckUITests]
